# Test profile: H2 in-memory database, no PostgreSQL needed.
# Loaded by tests with @ActiveProfiles("test").
spring.datasource.url=jdbc:h2:mem:vettestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Test-only secret (64 chars). Never use a real secret here or in production.
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=86400000
